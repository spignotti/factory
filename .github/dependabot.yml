# Dependabot, tuned for Actions minutes (GitHub Pro, additional usage off): monthly, grouped, no auto-rebase.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Every rebase reruns CI; rebase on request with `@dependabot rebase`.
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Every rebase reruns CI; rebase on request with `@dependabot rebase`.
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
