name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The evaluator's browser tests run against Playwright's Chromium headless shell.
      - run: pnpm exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
