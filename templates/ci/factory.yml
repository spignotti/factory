# Generated from spignotti/factory templates/ci/factory.yml. Do not edit by hand:
# `factory doctor --repo .` compares this file's hash with the template for the pinned ref.
# Render a new one with `factory ci-stub --ref <tag>`; bumping the ref is a deliberate PR.
name: factory
# No run on pushes to the base branch: the PR run already checked the merged tree, and a base commit
# without check runs makes the factory run the fast checks locally instead. Release tags and
# workflow_dispatch (a deploy) run the same checks. A pull request selects checks whose paths match
# the diff. A tag and a manual run have no such diff: the tag is a commit already on the base, so
# `factory gates --select --base origin/main` would keep only path-less checks. Those events pass
# `--all` and run every check of the tier. One stub, not a reusable workflow: doctor hashes this
# single file and branch protection requires one status, `done`. A draft pull request does not run
# select/check. `done` still runs and fails: a skipped required check counts as passed, so skipping
# `done` would turn a draft into a green gate. ready_for_review and a later push to a ready PR run
# the full matrix. converted_to_draft cancels an in-flight full run and fails `done`. Nothing is
# skipped because of author, branch, labels, or the PR body. Tags and workflow_dispatch are unchanged.
# On a pull request, `done` also requires the commit status `factory=success` on this SHA. The runner
# posts that only after it has verified the commit. A later push has no status, so auto-merge cannot
# finish that head while the runner is asleep. The job retries briefly: the status is posted just after the push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tier:
        description: "Gate tier (fast | full | manual)"
        default: manual
permissions:
  contents: read
  statuses: read
# Draft events and ready events do not cancel each other: cancelling the full run can leave `done`
# skipped (GitHub then treats it as passed) or can fail it after the ready run already succeeded.
# A newer event of the same kind still cancels the older one. converted_to_draft uses the full
# group so an in-flight ready run cannot finish green. `done` exits non-zero when this run was
# cancelled. A manual run and a tag are never cancelled.
concurrency:
  group: factory-${{ (github.event.action == 'converted_to_draft' && 'full') || (github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft') || 'full' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Node 22.23.4 ships npm 10.9.9. Its libnpmexec (9.0.5) calls pacote without an Arborist,
# and GitFetcher then refuses to pack a git dependency (`npx github:<repo>#<ref>`).
# npm 11.21.1 (libnpmexec 10.3.4) passes Arborist. The factory pin stays that git ref.
env:
  FACTORY: "npx --yes --package npm@11.21.1 -- npm exec --yes --package github:spignotti/factory#@FACTORY_REF@ -- factory"
jobs:
  select:
    # Draft events skip the runner. `done` still runs and fails; this job is not a required check.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.s.outputs.checks }}
      toolchains: ${{ steps.s.outputs.toolchains }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The npx install of the pinned factory (git clone + build) is cached per pinned ref.
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: factory-npx-${{ runner.os }}-${{ env.FACTORY }}
      - id: s
        env:
          TIER: ${{ inputs.tier || 'full' }}
          # Pull requests filter by the PR base. Tags and workflow_dispatch set ALL: a release tag
          # points at a commit on the base, so a diff against origin/main is empty.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          ALL: ${{ github.event_name != 'pull_request' }}
        run: |
          # --all: every check of the tier, no path filter. A tag or workflow_dispatch diff is empty.
          if [ "$ALL" = true ]; then
            checks=$($FACTORY gates --select --tier "$TIER" --all --json)
          else
            checks=$($FACTORY gates --select --tier "$TIER" --base "$BASE" --json)
          fi
          echo "selected: $checks"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          toolchains=$($FACTORY gates --toolchains --json)
          echo "toolchains: $toolchains"
          echo "toolchains=$toolchains" >> "$GITHUB_OUTPUT"
  check:
    needs: select
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.select.outputs.checks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.select.outputs.checks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchains from `factory gates --toolchains`: repo.yaml ci.toolchains, else detected from the repo's files.
      - if: fromJson(needs.select.outputs.toolchains).pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ fromJson(needs.select.outputs.toolchains).pnpm_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJson(needs.select.outputs.toolchains).node }}
      - if: fromJson(needs.select.outputs.toolchains).python != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJson(needs.select.outputs.toolchains).python }}
      - if: fromJson(needs.select.outputs.toolchains).uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ fromJson(needs.select.outputs.toolchains).uv_version }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: factory-npx-${{ runner.os }}-${{ env.FACTORY }}
      - env:
          CHECK: ${{ matrix.check }}
        run: $FACTORY gates --run "$CHECK"
  # The single required status check, named `done` (the job name; GitHub Actions reports no workflow prefix).
  # always(): a skipped `done` is a successful required check. Draft and cancelled runs exit 1 instead.
  # `cancelled()` is legal only in an `if`. GitHub rejects the workflow when it appears in `env` or `run`.
  # The step must run and fail: a skipped step would leave this job successful.
  done:
    needs: [select, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: cancelled()
        run: |
          echo "cancelled: not a successful check"
          exit 1
      - env:
          SELECT: ${{ needs.select.result }}
          CHECK: ${{ needs.check.result }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'true' || 'false' }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$DRAFT" = "true" ]; then
            echo "draft: checks are not run until the pull request is ready for review"
            exit 1
          fi
          echo "select: $SELECT, check: $CHECK"
          test "$SELECT" = success
          test "$CHECK" = success || test "$CHECK" = skipped
          if [ "${EVENT:-}" != "pull_request" ]; then
            exit 0
          fi
          # Combined status: latest state of each context. A missing or non-success `factory` status blocks.
          tries="${FACTORY_APPROVAL_TRIES:-6}"
          pause="${FACTORY_APPROVAL_SLEEP:-10}"
          n=0
          while [ "$n" -lt "$tries" ]; do
            n=$((n + 1))
            body="$(curl -sS --header "Authorization: Bearer ${TOKEN}" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/commits/${SHA}/status" || true)"
            state="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{let data={};try{data=JSON.parse(s||"{}")}catch(e){}const hit=(data.statuses||[]).find(i=>i&&i.context==="factory");process.stdout.write((hit&&hit.state)||"")})')"
            if [ "$state" = "success" ]; then
              echo "factory approval on ${SHA}"
              exit 0
            fi
            if [ "$n" -lt "$tries" ]; then
              sleep "$pause"
            fi
          done
          echo "factory approval missing on ${SHA}"
          exit 1
