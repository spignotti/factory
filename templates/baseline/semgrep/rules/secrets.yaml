# factory-baseline-version: 1
# High-precision patterns only. A broad password regex false-positives on tests and docs.
rules:
  - id: factory.baseline.aws-access-key
    languages: [generic]
    severity: ERROR
    message: AWS access key id
    metadata:
      category: security
      cwe: "CWE-798"
      owasp: "A07:2021-Identification and Authentication Failures"
    pattern-regex: AKIA[0-9A-Z]{16}
  - id: factory.baseline.private-key
    languages: [generic]
    severity: ERROR
    message: PEM private key
    metadata:
      category: security
      cwe: "CWE-798"
    pattern-regex: -----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----
