base: a7b94e69ff6159de8ddfd4940c90db4708c0d67e
task: |
  withoutBase can produce a protocol-relative URL (open redirect)

  Stripping a base can leave a path that starts with `//`, e.g. `withoutBase("/base//evil.com", "/base")`
  returns `"//evil.com"`, which browsers treat as a protocol-relative URL to another host. The result of
  `withoutBase` must never start with more than one slash: collapse leading slashes to a single `/`.
