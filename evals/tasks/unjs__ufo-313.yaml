task: |
  withBase / withoutBase match the base as a plain string prefix

  `withoutBase("/admin-dashboard", "/admin/")` returns `"/-dashboard"`: the base `/admin` is stripped although
  `/admin-dashboard` is not inside it. `withBase("/admin-dashboard", "/admin")` likewise returns the input
  unchanged instead of prefixing it. A base must only match on a path segment boundary
  (`/admin` matches `/admin` and `/admin/...`, not `/admin-dashboard`).
