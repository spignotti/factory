# Built-in role -> model chains (Silas's defaults).
# Override per user in ~/.factory/profile.yaml and per repo in .factory/repo.yaml `models:`.
roles:
  plan_high:         [{ model: openai/gpt-6.1-sol, thinking: high }]
  plan_medium:       [{ model: openai/gpt-6.1-sol, thinking: medium }]
  plan_normalize:    [{ model: opencode-go/deepseek-v4.1-flash }]
  # One explicit cross-family backup, used only after capacity retries on the primary are exhausted.
  implement:
    - { model: opencode-go/deepseek-v4.1-flash, thinking: high }
    - { model: opencode-go/mimo-v2.6-flash, capacity_only: true }
  review_plan:       [{ model: openai/gpt-6.1-sol, thinking: medium }]
  review_checklist:  [{ model: openai/gpt-6.1-sol, thinking: medium }]
  review_security:   [{ model: openai/gpt-6.1-sol, thinking: high }]
  review_simplicity: [{ model: openai/gpt-6-luna, thinking: medium }]
  evaluate:          [{ model: openai/gpt-6-luna, thinking: medium }]
  pr_writer:         [{ model: opencode-go/deepseek-v4.1-flash }]
  harden:            [{ model: openai/gpt-6.1-sol, thinking: medium }]
# Scheduled `factory gc --scheduled` defaults to dry-run until you flip this after a week of log review.
gc:
  retention:
    dry_run: true
    home_hours: 24
    worktree_failed_days: 7
    worktree_resume_days: 14
    metadata_days: 90
    metadata_failed_days: 180
    metadata_min_per_repo: 20
    archive_tarball_days: 180
# Billing kind per provider: subscription usage is reported in tokens, metered usage in USD.
# Providers not listed are metered. Only this file and the user profile may set it.
billing:
  opencode-go: subscription
  openai: subscription
# Agent steps with the docs_lookup tool (Context7, run by the factory; CONTEXT7_API_KEY optional).
docs_lookup:
  roles: [plan, implement, fix]
retry:
  base_ms: 2000
  max_ms: 60000
  attempts: 4
env: {}
